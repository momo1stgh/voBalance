<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luxury Expense Tracker</title>
  <style>
    :root {
      --sage-green: #1D5D5D;
      --deep-sage: #3B4A39;
      --matte-gold: #C5A059;
      --soft-bg: #F4F6F3;
      --card-bg: #FFFFFF;
      --income-green: #6F803C;
      --expense-red: #A3464D;
      --border-light: #EAECE8;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--soft-bg); margin: 0; padding: 16px; color: #2A3229; padding-bottom: 80px; }
    .container { max-width: 480px; margin: 0 auto; }
    
    h2 { text-align: center; margin: 0 0 18px 0; color: var(--sage-green); font-size: 22px; }
    
    /* Tabs */
    .tab-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: #EAECE8; color: #666; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .tab-btn.active-acc { background: var(--sage-green); color: #fff; }
    .tab-btn.active-exp { background: var(--expense-red); color: #fff; }
    .tab-btn.active-inc { background: var(--income-green); color: #fff; }

    /* Summary Card */
    .card { background: linear-gradient(135deg, var(--sage-green), #113636); color: #fff; padding: 20px; border-radius: 20px; margin-bottom: 18px; border-left: 6px solid var(--matte-gold); text-align: center; box-shadow: 0 8px 20px rgba(29,93,93,0.15); }
    .summary-grid { display: flex; justify-content: space-around; margin-top: 10px; }
    .summary-val { font-size: 20px; font-weight: bold; }
    
    .status { text-align: center; font-size: 14px; color: #555; padding: 10px; background: #EFEFEF; border-radius: 12px; margin-bottom: 16px; }

    /* Manual Input Form */
    .manual-box { background: var(--card-bg); padding: 16px; border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--border-light); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
    .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .input-row input, .input-row select { flex: 1; padding: 10px; border: 1px solid #CCC; border-radius: 10px; font-size: 14px; background: #FFF; color: #333; }
    .add-btn { width: 100%; padding: 12px; background: var(--sage-green); color: #FFF; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; }

    /* Section Titles */
    h3 { font-size: 16px; color: var(--sage-green); border-bottom: 2px solid var(--matte-gold); padding-bottom: 6px; margin-top: 24px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .settings-btn { font-size: 12px; background: #EAECE8; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; color: #444; }

    /* Chart Area */
    .chart-container { background: var(--card-bg); border-radius: 16px; padding: 16px; border: 1px solid var(--border-light); margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .chart-legend { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .legend-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 4px 0; border-bottom: 1px solid #F5F5F5; }
    .legend-color { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: 6px; }

    /* Record List */
    .list { list-style: none; padding: 0; margin: 0; background: var(--card-bg); border-radius: 16px; padding: 10px; border: 1px solid var(--border-light); }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #F0F0F0; cursor: pointer; }
    .list-item:last-child { border-bottom: none; }
    .item-tag { font-size: 11px; background: #EAECE8; padding: 3px 8px; border-radius: 8px; color: #555; margin-right: 6px; }
    .item-date { font-size: 12px; color: #999; margin-top: 4px; }
    
    /* Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #FFF; width: 100%; max-width: 400px; padding: 20px; border-radius: 20px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 18px; font-weight: bold; color: var(--sage-green); margin-bottom: 16px; text-align: center; }
    .modal-btn-group { display: flex; gap: 10px; margin-top: 16px; }
    .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .btn-save { background: var(--sage-green); color: #FFF; }
    .btn-cancel { background: #EAECE8; color: #555; }
    .btn-delete { background: var(--expense-red); color: #FFF; margin-top: 10px; width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    
    .sortable-item { display: flex; align-items: center; justify-content: space-between; background: #F9F9F9; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; border: 1px solid #EAECE8; }
    .sortable-btns button { background: #EAECE8; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>Luxury Expense Tracker</h2>
  
  <div class="tab-group">
    <button class="tab-btn active-acc" id="tab-studio" onclick="setAccount('Studio')">🏢 Studio</button>
    <button class="tab-btn" id="tab-personal" onclick="setAccount('Personal')">🏠 個人 (Personal)</button>
  </div>
  <div class="tab-group">
    <button class="tab-btn active-exp" id="tab-expense" onclick="setType('expense')">💸 開支 (Expense)</button>
    <button class="tab-btn" id="tab-income" onclick="setType('income')">💰 收入 (Income)</button>
  </div>

  <div class="card">
    <div style="font-size: 13px; opacity: 0.8;">當前帳戶: <span id="acc-display">Studio</span> (<span id="month-display">本月</span>)</div>
    <div class="summary-grid">
      <div>總收入<br><span class="summary-val" style="color:var(--income-green)" id="total-inc">$0.00</span></div>
      <div>總開支<br><span class="summary-val" style="color:var(--expense-red)" id="total-exp">$0.00</span></div>
    </div>
  </div>

  <div class="status" id="status-box">請在下方手動輸入紀錄</div>

  <!-- 手動輸入區塊 -->
  <div class="manual-box">
    <div class="input-row">
      <input type="date" id="add-date">
      <select id="add-cat" onchange="checkCustomCategory('add-cat')"></select>
    </div>
    <div class="input-row">
      <input type="text" id="add-item" placeholder="項目名稱 (選填)">
      <input type="number" id="add-amt" placeholder="金額 $ (支援小數)" step="0.01">
    </div>
    <button class="add-btn" onclick="addManualRecord()">新增紀錄</button>
  </div>

  <!-- 當月分類圓餅圖 -->
  <h3>
    <span>📊 當月分類比例</span>
    <button class="settings-btn" onclick="openSortModal()">⚙️ 排序分類</button>
  </h3>
  <div class="chart-container">
    <canvas id="pieChart" width="200" height="200" style="max-width:200px; max-height:200px;"></canvas>
    <div class="chart-legend" id="chart-legend"></div>
  </div>

  <!-- 當月列表 -->
  <h3>📝 當月紀錄 <span style="font-size:12px; font-weight:normal; color:#888;">點擊可編輯</span></h3>
  <ul class="list" id="record-list"></ul>
</div>

<!-- 編輯視窗 -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-content">
    <div class="modal-title">編輯紀錄</div>
    <input type="hidden" id="edit-id">
    <div class="input-row"><input type="date" id="edit-date"></div>
    <div class="input-row"><select id="edit-cat" onchange="checkCustomCategory('edit-cat')"></select></div>
    <div class="input-row"><input type="text" id="edit-item" placeholder="項目名稱"></div>
    <div class="input-row"><input type="number" id="edit-amt" placeholder="金額 $" step="0.01"></div>
    
    <div class="modal-btn-group">
      <button class="modal-btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="modal-btn btn-save" onclick="saveEdit()">儲存</button>
    </div>
    <button class="btn-delete" onclick="deleteRecord()">🗑️ 刪除此紀錄</button>
  </div>
</div>

<!-- 分類排序視窗 -->
<div class="modal-overlay" id="sort-modal">
  <div class="modal-content">
    <div class="modal-title">調整分類排序</div>
    <div id="sort-list-container" style="margin-bottom:15px; max-height:250px; overflow-y:auto;"></div>
    <div class="modal-btn-group">
      <button class="modal-btn btn-cancel" onclick="closeSortModal()">關閉</button>
      <button class="modal-btn btn-save" onclick="saveSortOrder()">儲存排序</button>
    </div>
  </div>
</div>

<script>
  let account = 'Studio';
  let type = 'expense';
  let records = JSON.parse(localStorage.getItem('luxury_records_v3') || '[]');
  
  const defaultCategories = {
    Personal: {
      expense: ["飲食", "糧儲", "家居", "營運", "交通", "購物-衣", "購物-物質", "購物-送禮", "學習/進修", "保險/投資", "家用", "其他"],
      income: ["補習", "yoga", "sound", "movements", "workshops", "gifted", "其他"]
    },
    Studio: {
      expense: ["場地租金", "營運", "Tools", "行銷", "其他"],
      income: ["yoga", "sound", "workshops", "其他"]
    }
  };
  
  let savedCategories = JSON.parse(localStorage.getItem('luxury_categories_v3'));
  if (!savedCategories) {
    savedCategories = defaultCategories;
    localStorage.setItem('luxury_categories_v3', JSON.stringify(savedCategories));
  }

  function getLocalYMD() {
    const d = new Date();
    const offset = d.getTimezoneOffset() * 60000;
    return new Date(d.getTime() - offset).toISOString().split('T')[0];
  }
  
  const currentMonth = getLocalYMD().substring(0, 7);
  document.getElementById('add-date').value = getLocalYMD();

  const chartColors = [
    '#1D5D5D', '#C5A059', '#6F803C', '#A3464D', '#4A6B82', 
    '#D9822B', '#7A4988', '#207C69', '#A65141', '#5B6770'
  ];

  function updateCategoryDropdown(selectId, selectedValue = '') {
    const selectEl = document.getElementById(selectId);
    const catList = savedCategories[account][type];
    
    selectEl.innerHTML = catList.map(c => `<option value="${c}">${c}</option>`).join('');
    selectEl.innerHTML += `<option value="ADD_NEW" style="color:var(--matte-gold); font-weight:bold;">[ + 新增自訂分類 ]</option>`;
    
    if (selectedValue && catList.includes(selectedValue)) {
      selectEl.value = selectedValue;
    } else {
      selectEl.value = catList[0];
    }
  }

  function checkCustomCategory(selectId) {
    const selectEl = document.getElementById(selectId);
    if (selectEl.value === 'ADD_NEW') {
      const newCat = prompt("請輸入新的分類名稱:");
      if (newCat && newCat.trim() !== '') {
        savedCategories[account][type].push(newCat.trim());
        localStorage.setItem('luxury_categories_v3', JSON.stringify(savedCategories));
        updateCategoryDropdown('add-cat', newCat.trim());
        updateCategoryDropdown('edit-cat', newCat.trim());
      } else {
        updateCategoryDropdown(selectId);
      }
    }
  }

  function addManualRecord() {
    const date = document.getElementById('add-date').value || getLocalYMD();
    const cat = document.getElementById('add-cat').value;
    let item = document.getElementById('add-item').value.trim();
    const amt = parseFloat(document.getElementById('add-amt').value);
    
    if (isNaN(amt)) {
      alert("請輸入有效的金額");
      return;
    }
    if (!item) item = cat;

    records.push({
      id: Date.now(), account, type, category: cat, item, amount: amt, date
    });

    saveRecords();
    document.getElementById('add-item').value = '';
    document.getElementById('add-amt').value = '';
    document.getElementById('status-box').innerText = `✅ 新增成功: ${item} $${amt.toFixed(2)}`;
    render();
  }

  function setAccount(acc) {
    account = acc;
    document.getElementById('tab-studio').className = 'tab-btn ' + (acc==='Studio'?'active-acc':'');
    document.getElementById('tab-personal').className = 'tab-btn ' + (acc==='Personal'?'active-acc':'');
    document.getElementById('acc-display').innerText = acc;
    updateCategoryDropdown('add-cat');
    render();
  }

  function setType(t) {
    type = t;
    document.getElementById('tab-expense').className = 'tab-btn ' + (t==='expense'?'active-exp':'');
    document.getElementById('tab-income').className = 'tab-btn ' + (t==='income'?'active-inc':'');
    updateCategoryDropdown('add-cat');
    render();
  }

  function openEditModal(id) {
    const r = records.find(x => x.id === id);
    if(!r) return;
    
    document.getElementById('edit-id').value = r.id;
    document.getElementById('edit-date').value = r.date;
    updateCategoryDropdown('edit-cat', r.category);
    document.getElementById('edit-item').value = r.item;
    document.getElementById('edit-amt').value = r.amount;
    
    document.getElementById('edit-modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('edit-modal').style.display = 'none';
  }

  function saveEdit() {
    const id = parseInt(document.getElementById('edit-id').value, 10);
    const rIndex = records.findIndex(x => x.id === id);
    if(rIndex > -1) {
      records[rIndex].date = document.getElementById('edit-date').value;
      records[rIndex].category = document.getElementById('edit-cat').value;
      records[rIndex].item = document.getElementById('edit-item').value || records[rIndex].category;
      records[rIndex].amount = parseFloat(document.getElementById('edit-amt').value) || 0;
      saveRecords();
      closeModal();
      render();
    }
  }

  function deleteRecord() {
    const id = parseInt(document.getElementById('edit-id').value, 10);
    if(confirm("確定要刪除這筆紀錄嗎？")) {
      records = records.filter(x => x.id !== id);
      saveRecords();
      closeModal();
      render();
    }
  }

  function saveRecords() {
    localStorage.setItem('luxury_records_v3', JSON.stringify(records));
  }

  // --- 分類排序功能 ---
  function openSortModal() {
    const container = document.getElementById('sort-list-container');
    const catList = savedCategories[account][type];
    container.innerHTML = catList.map((c, index) => `
      <div class="sortable-item" data-cat="${c}">
        <span>${c}</span>
        <div class="sortable-btns">
          <button onclick="moveCat(${index}, -1)">▲</button>
          <button onclick="moveCat(${index}, 1)">▼</button>
        </div>
      </div>
    `).join('');
    document.getElementById('sort-modal').style.display = 'flex';
  }

  function closeSortModal() {
    document.getElementById('sort-modal').style.display = 'none';
  }

  function moveCat(index, direction) {
    const catList = savedCategories[account][type];
    const newIndex = index + direction;
    if (newIndex >= 0 && newIndex < catList.length) {
      const temp = catList[index];
      catList[index] = catList[newIndex];
      catList[newIndex] = temp;
      openSortModal(); // 重新整理排序視窗
    }
  }

  function saveSortOrder() {
    localStorage.setItem('luxury_categories_v3', JSON.stringify(savedCategories));
    closeSortModal();
    updateCategoryDropdown('add-cat');
    render();
  }

  // --- 畫布圓餅圖繪製 ---
  function drawPieChart(dataMap) {
    const canvas = document.getElementById('pieChart');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const total = Object.values(dataMap).reduce((a, b) => a + b, 0);
    const keys = Object.keys(dataMap);

    if (total === 0 || keys.length === 0) {
      ctx.fillStyle = '#CCCCCC';
      ctx.beginPath();
      ctx.arc(100, 100, 80, 0, 2 * Math.PI);
      ctx.fill();
      return;
    }

    let startAngle = 0;
    keys.forEach((key, index) => {
      const val = dataMap[key];
      const sliceAngle = (val / total) * 2 * Math.PI;
      const color = chartColors[index % chartColors.length];

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(100, 100);
      ctx.arc(100, 100, 80, startAngle, startAngle + sliceAngle);
      ctx.closePath();
      ctx.fill();

      startAngle += sliceAngle;
    });
  }

  function render() {
    const d = new Date();
    document.getElementById('month-display').innerText = `${d.getMonth()+1}月`;

    const currentMonthRecords = records.filter(r => r.account === account && r.date.startsWith(currentMonth));
    
    let totalInc = 0, totalExp = 0;
    currentMonthRecords.forEach(r => {
      if (r.type === 'income') totalInc += r.amount;
      else totalExp += r.amount;
    });
    
    document.getElementById('total-inc').innerText = '$' + totalInc.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    document.getElementById('total-exp').innerText = '$' + totalExp.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

    const tabRecords = currentMonthRecords.filter(r => r.type === type);
    
    // 按照自訂順序排列分類金額
    const catMap = {};
    savedCategories[account][type].forEach(c => { catMap[c] = 0; });
    
    tabRecords.forEach(r => {
      if (catMap[r.category] !== undefined) {
        catMap[r.category] += r.amount;
      } else {
        catMap[r.category] = r.amount; // 應對自訂分類
      }
    });

    // 濾除金額為 0 的分類供圓餅圖使用（保持排序）
    const activeDataMap = {};
    Object.keys(catMap).forEach(k => {
      if (catMap[k] > 0) activeDataMap[k] = catMap[k];
    });

    drawPieChart(activeDataMap);

    // 渲染圖例與數值
    const legendEl = document.getElementById('chart-legend');
    const activeKeys = Object.keys(activeDataMap);
    if (activeKeys.length === 0) {
      legendEl.innerHTML = '<div style="text-align:center; color:#999; padding:5px;">本月尚無分類數據</div>';
    } else {
      let colorIdx = 0;
      legendEl.innerHTML = activeKeys.map(k => {
        const color = chartColors[colorIdx++ % chartColors.length];
        const val = activeDataMap[k];
        return `
          <div class="legend-item">
            <div><span class="legend-color" style="background:${color}"></span>${k}</div>
            <div style="font-weight:bold;">$${val.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
          </div>
        `;
      }).join('');
    }

    // 渲染紀錄列表
    const listEl = document.getElementById('record-list');
    tabRecords.sort((a,b) => new Date(b.date) - new Date(a.date));
    
    if (tabRecords.length === 0) {
      listEl.innerHTML = '<div style="text-align:center; padding:20px; color:#999;">本月無相關紀錄</div>';
    } else {
      listEl.innerHTML = tabRecords.map(r => `
        <li class="list-item" onclick="openEditModal(${r.id})">
          <div>
            <div>
              <span class="item-tag">${r.category}</span>
              <strong style="color:var(--text-dark)">${r.item}</strong> 
            </div>
            <div class="item-date">${r.date}</div>
          </div>
          <div style="font-weight:bold; font-size:16px; color:${r.type==='income'?'var(--income-green)':'var(--expense-red)'}">
            ${r.type==='income'?'+':'-'}$${r.amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
          </div>
        </li>
      `).join('');
    }
  }

  updateCategoryDropdown('add-cat');
  render();
</script>
</body>
</html>
