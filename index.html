<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>語音記帳 App</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; max-width: 480px; margin: auto; background-color: #f8f9fa; color: #333; }
    .container { background: #ffffff; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { text-align: center; margin-top: 0; margin-bottom: 16px; color: #2c3e50; }
    
    /* 圓角按鈕群組 */
    .flex { display: flex; gap: 8px; margin-bottom: 12px; background: #eee; padding: 4px; border-radius: 12px; }
    .flex button { flex: 1; padding: 10px; font-size: 14px; font-weight: bold; border: none; background: transparent; color: #666; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .flex button.active { background: #007bff; color: white; box-shadow: 0 2px 6px rgba(0,123,255,0.3); }

    /* 統計資訊卡片 */
    .card { background: #f0f4f8; padding: 16px; border-radius: 16px; margin-bottom: 16px; border-left: 4px solid #007bff; }
    .card-title { font-size: 13px; color: #666; margin-bottom: 8px; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .summary-item { background: #ffffff; padding: 10px; border-radius: 10px; text-align: center; font-weight: bold; font-size: 15px; }

    /* 圓角麥克風按鈕 */
    .mic-btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: white; background: #28a745; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 10px rgba(40,167,69,0.25); transition: 0.2s; }
    
    .status { text-align: center; color: #666; font-size: 13px; margin: 12px 0; min-height: 20px; }
    
    /* 列表樣式 */
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
    .delete-btn { color: #dc3545; cursor: pointer; padding: 4px 8px; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>語音記帳 App</h2>

  <!-- 帳戶選擇 -->
  <div class="flex">
    <button id="tab-studio" class="active" onclick="switchAccount('Studio')">🏢 Studio</button>
    <button id="tab-personal" onclick="switchAccount('Personal')">🏠 Personal (私人)</button>
  </div>

  <!-- 類別選擇 -->
  <div class="flex">
    <button id="tab-expense" class="active" onclick="switchType('expense')">💸 支出</button>
    <button id="tab-income" onclick="switchType('income')">💰 收入</button>
  </div>

  <!-- 統計摘要 (只有總收入與總支出) -->
  <div class="card">
    <div class="card-title">目前檢視帳戶：<strong id="current-account-display">Studio</strong></div>
    <div class="summary-grid">
      <div class="summary-item" style="color: #28a745;">收入: $<span id="total-income">0</span></div>
      <div class="summary-item" style="color: #dc3545;">支出: $<span id="total-expense">0</span></div>
    </div>
  </div>

  <!-- 語音按鈕 -->
  <button id="mic-btn" class="mic-btn" onclick="toggleListening()">🎙️ 點擊開始語音輸入</button>
  <div id="status-text" class="status">請按下按鈕試講：「晚飯 20蚊」</div>

  <h3 id="list-title" style="font-size: 16px; margin-top: 20px; color: #495057;">近期支出紀錄</h3>
  <div id="record-list"></div>
</div>

<script>
  let currentAccount = 'Studio';
  let currentType = 'expense';
  let records = JSON.parse(localStorage.getItem('accounting_records') || '[]');
  let recognition = null;
  let isListening = false;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'zh-HK';

    recognition.onstart = () => {
      isListening = true;
      document.getElementById('mic-btn').innerText = '🛑 聆聽中...請說話';
      document.getElementById('status-text').innerText = '正在聆聽...';
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      parseSpeechSmart(transcript);
    };

    recognition.onerror = () => {
      document.getElementById('status-text').innerText = '聽不清楚，請再試一次';
      stopListening();
    };

    recognition.onend = () => stopListening();
  } else {
    document.getElementById('status-text').innerText = '你的瀏覽器不支援語音辨識';
  }

  function toggleListening() {
    if (!recognition) return;
    isListening ? recognition.stop() : recognition.start();
  }

  function stopListening() {
    isListening = false;
    document.getElementById('mic-btn').innerText = '🎙️ 點擊開始語音輸入';
  }

  function switchAccount(account) {
    currentAccount = account;
    document.getElementById('tab-studio').className = account === 'Studio' ? 'active' : '';
    document.getElementById('tab-personal').className = account === 'Personal' ? 'active' : '';
    document.getElementById('current-account-display').innerText = account === 'Personal' ? 'Personal (私人)' : 'Studio';
    renderRecords();
  }

  function switchType(type) {
    currentType = type;
    document.getElementById('tab-expense').className = type === 'expense' ? 'active' : '';
    document.getElementById('tab-income').className = type === 'income' ? 'active' : '';
    document.getElementById('list-title').innerText = type === 'expense' ? '近期支出紀錄' : '近期收入紀錄';
    renderRecords();
  }

  function zhToNum(text) {
    const zhMap = { '零':0, '一':1, '二':2, '兩':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '十':10, '廿':20, '卅':30 };
    return text.replace(/[零一二兩三四五六七八九十廿卅]/g, m => zhMap[m]);
  }

  function parseSpeechSmart(transcript) {
    let raw = transcript.trim();
    let lower = zhToNum(raw).toLowerCase();

    // 判斷帳戶
    if (/私人|個人|personal|自己/.test(lower)) switchAccount('Personal');
    else if (/studio|工作室|公司/.test(lower)) switchAccount('Studio');

    // 判斷收入或支出
    let recordType = currentType;
    if (/收入|賺|入數|收|出糧|學費/.test(lower)) recordType = 'income';
    else if (/支出|用咗|買|花|付|找數|餐|dinner|lunch|晚飯|晚餐|食飯/.test(lower)) recordType = 'expense';
    switchType(recordType);

    // 提取數字
    const numbers = lower.match(/\d+/g);
    if (!numbers) {
      document.getElementById('status-text').innerText = `收到：「${raw}」(未找到數字)`;
      return;
    }
    const amount = parseInt(numbers[numbers.length - 1], 10);

    // 提取項目名稱
    let itemName = lower
      .replace(/私人|個人|personal|自己|studio|工作室|公司|新增|支出|收入|記錄|記帳|賺|收|蚊|塊|元|save|儲存/gi, '')
      .replace(/\d+/g, '')
      .replace(/[，,。.！!]/g, '')
      .trim();

    if (!itemName) {
      if (/晚飯|晚餐|dinner|食飯|餐/.test(lower)) itemName = '晚飯';
      else itemName = recordType === 'income' ? '收入' : '支出';
    }

    // 儲存紀錄
    const record = {
      id: Date.now(),
      account: currentAccount,
      type: recordType,
      item: itemName,
      amount: amount,
      date: new Date().toLocaleDateString('zh-HK')
    };

    records.push(record);
    localStorage.setItem('accounting_records', JSON.stringify(records));
    renderRecords();

    document.getElementById('status-text').innerText = `✅ 成功新增：${itemName} $${amount}`;
  }

  function deleteRecord(id) {
    records = records.filter(r => r.id !== id);
    localStorage.setItem('accounting_records', JSON.stringify(records));
    renderRecords();
  }

  function renderRecords() {
    const listEl = document.getElementById('record-list');
    listEl.innerHTML = '';
    
    let totalIncome = 0;
    let totalExpense = 0;

    records.filter(r => r.account === currentAccount).forEach(r => {
      if (r.type === 'income') totalIncome += r.amount;
      else totalExpense += r.amount;
    });

    document.getElementById('total-income').innerText = totalIncome;
    document.getElementById('total-expense').innerText = totalExpense;

    const filtered = records.filter(r => r.account === currentAccount && (r.type || 'expense') === currentType);

    filtered.forEach(r => {
      const div = document.createElement('div');
      div.className = 'list-item';
      const sign = r.type === 'income' ? '+$' : '-$';

      div.innerHTML = `
        <span><strong>${r.item}</strong> (${r.date})</span>
        <span>${sign}${r.amount} <span class="delete-btn" onclick="deleteRecord(${r.id})">✕</span></span>
      `;
      listEl.appendChild(div);
    });
  }

  renderRecords();
</script>
</body>
</html>
