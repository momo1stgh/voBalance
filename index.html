<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voice Expense Tracker</title>
  <style>
    :root {
      --jewel-teal: #0D5C63;
      --rich-gold: #C5A059;
      --amethyst-purple: #4A2040;
      --income-green: #2E7D32;
      --bg-color: #F8F6F0;
      --text-color: #2C2C2C;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); margin: 0; padding: 16px; color: var(--text-color); }
    .container { max-width: 480px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(13, 92, 99, 0.08); border: 1px solid rgba(197, 160, 89, 0.2); }
    
    h2 { text-align: center; margin: 0 0 16px 0; color: var(--jewel-teal); font-weight: 700; font-size: 20px; letter-spacing: 0.5px; }
    
    /* Account Tabs */
    .account-tab-group { display: flex; gap: 8px; margin-bottom: 12px; background: #EFECE6; padding: 4px; border-radius: 12px; }
    .account-tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #666; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s; }
    .account-tab-btn.active { background: var(--jewel-teal); color: #ffffff; box-shadow: 0 3px 8px rgba(13, 92, 99, 0.2); }

    /* Type Tabs */
    .type-tab-group { display: flex; gap: 8px; margin-bottom: 16px; }
    .type-tab-btn { flex: 1; padding: 8px; border: 1px solid var(--jewel-teal); background: transparent; color: var(--jewel-teal); border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.3s; }
    .type-tab-btn.active-expense { background: var(--amethyst-purple); color: #FFF; border-color: var(--amethyst-purple); }
    .type-tab-btn.active-income { background: var(--income-green); color: #FFF; border-color: var(--income-green); }
    
    /* Summary Card */
    .card { background: linear-gradient(135deg, var(--amethyst-purple), #31132A); color: #ffffff; padding: 18px 20px; border-radius: 16px; margin-bottom: 16px; box-shadow: 0 6px 15px rgba(74, 32, 64, 0.2); border-left: 5px solid var(--rich-gold); }
    .card-account { font-size: 13px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; text-align: center; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .summary-item { text-align: center; background: rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 10px; }
    .summary-label { font-size: 12px; opacity: 0.85; margin-bottom: 4px; }
    .summary-val { font-size: 18px; font-weight: bold; }
    .summary-val.income { color: #81C784; }
    .summary-val.expense { color: #FF8A80; }

    /* Microphone Button */
    .mic-btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: #ffffff; background: linear-gradient(135deg, var(--rich-gold), #A8833E); border: none; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(197, 160, 89, 0.3); transition: 0.3s; }
    .mic-btn.recording { background: #D9534F; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    
    .status { text-align: center; font-size: 13px; color: #555; min-height: 24px; margin-bottom: 16px; word-break: break-all; padding: 8px; background: #F0EAE1; border-radius: 8px; border: 1px solid #E2D9CC; }
    
    /* Record List */
    .list { list-style: none; padding: 0; margin: 0; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #EFECE6; }
    .amount-expense { font-weight: bold; color: var(--amethyst-purple); font-size: 16px; }
    .amount-income { font-weight: bold; color: var(--income-green); font-size: 16px; }
    .delete-btn { color: #BBB; font-size: 14px; cursor: pointer; margin-left: 12px; padding: 4px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Voice Expense Tracker</h2>
  
  <!-- Account Switcher -->
  <div class="account-tab-group">
    <button class="account-tab-btn active" id="tab-studio" onclick="switchAccount('Studio')">🏢 Studio</button>
    <button class="account-tab-btn" id="tab-personal" onclick="switchAccount('Personal')">🏠 Personal</button>
  </div>

  <!-- Type Switcher -->
  <div class="type-tab-group">
    <button class="type-tab-btn active-expense" id="tab-expense" onclick="switchType('expense')">💸 Expense</button>
    <button class="type-tab-btn" id="tab-income" onclick="switchType('income')">💰 Income</button>
  </div>

  <!-- Summary Card -->
  <div class="card">
    <div class="card-account">Current View: <strong id="current-account-display">Studio</strong></div>
    <div class="summary-grid">
      <div class="summary-item">
        <div class="summary-label">Total Income</div>
        <div class="summary-val income">$ <span id="total-income">0</span></div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Total Expense</div>
        <div class="summary-val expense">$ <span id="total-expense">0</span></div>
      </div>
    </div>
  </div>

  <!-- Mic Button -->
  <button class="mic-btn" id="mic-btn" onclick="toggleListening()">
    <span id="mic-icon">🎙️</span> <span id="mic-text">Tap to Speak</span>
  </button>

  <div class="status" id="status-text">Try saying: "Dinner 20" or "Personal lunch 15"</div>

  <h3 style="color: var(--jewel-teal); font-size: 15px; margin: 20px 0 10px 0;" id="list-title">Recent Expenses</h3>
  <ul class="list" id="record-list"></ul>
</div>

<script>
  let currentAccount = 'Studio';
  let currentType = 'expense';
  let records = JSON.parse(localStorage.getItem('accounting_records') || '[]');
  let recognition = null;
  let isListening = false;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
      isListening = true;
      document.getElementById('mic-btn').classList.add('recording');
      document.getElementById('mic-text').innerText = 'Listening... Speak now';
      document.getElementById('status-text').innerText = 'Listening...';
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      processVoiceInput(transcript);
    };

    recognition.onerror = () => {
      document.getElementById('status-text').innerText = 'Could not understand. Please try again.';
      stopListening();
    };

    recognition.onend = () => stopListening();
  } else {
    document.getElementById('status-text').innerText = 'Speech recognition is not supported on this browser.';
  }

  function toggleListening() {
    if (!recognition) return;
    isListening ? recognition.stop() : recognition.start();
  }

  function stopListening() {
    isListening = false;
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('mic-text').innerText = 'Tap to Speak';
  }

  function switchAccount(account) {
    currentAccount = account;
    document.getElementById('tab-studio').classList.toggle('active', account === 'Studio');
    document.getElementById('tab-personal').classList.toggle('active', account === 'Personal');
    document.getElementById('current-account-display').innerText = account;
    renderRecords();
  }

  function switchType(type) {
    currentType = type;
    const expBtn = document.getElementById('tab-expense');
    const incBtn = document.getElementById('tab-income');

    if (type === 'expense') {
      expBtn.className = 'type-tab-btn active-expense';
      incBtn.className = 'type-tab-btn';
      document.getElementById('list-title').innerText = 'Recent Expenses';
    } else {
      expBtn.className = 'type-tab-btn';
      incBtn.className = 'type-tab-btn active-income';
      document.getElementById('list-title').innerText = 'Recent Income';
    }
    renderRecords();
  }

  function extractAmount(text) {
    const matches = text.match(/\d+/g);
    if (matches && matches.length > 0) {
      return parseInt(matches[matches.length - 1], 10);
    }
    return null;
  }

  function processVoiceInput(rawText) {
    if (!rawText) return;

    let cleanText = rawText.trim();
    let lower = cleanText.toLowerCase();

    // 1. Determine Account
    if (/\b(personal|private|self|me)\b/.test(lower)) {
      switchAccount('Personal');
    } else if (/\b(studio|office|company|work)\b/.test(lower)) {
      switchAccount('Studio');
    }

    // 2. Determine Income or Expense
    let recordType = currentType;
    if (/\b(income|earned|gain|receive|salary|fee|tuition)\b/.test(lower)) {
      recordType = 'income';
    } else if (/\b(expense|spent|bought|pay|paid|cost|dinner|lunch|breakfast|coffee|rent)\b/.test(lower)) {
      recordType = 'expense';
    }
    switchType(recordType);

    // 3. Extract Amount
    let parsedAmount = extractAmount(cleanText);
    let finalAmount = parsedAmount !== null ? parsedAmount : 1;

    // 4. Extract Item Name
    let itemName = cleanText
      .replace(/\b(personal|studio|add|record|save|expense|income|dollars?|bucks?)\b/gi, '')
      .replace(/\d+/g, '')
      .replace(/[.,!]/g, '')
      .trim();

    if (!itemName) {
      if (/dinner|lunch|breakfast|coffee|food|meal/.test(lower)) itemName = 'Meal';
      else itemName = recordType === 'income' ? 'General Income' : 'General Expense';
    }

    itemName = itemName.charAt(0).toUpperCase() + itemName.slice(1);

    // 5. Store Record
    const newRecord = {
      id: Date.now(),
      account: currentAccount,
      type: recordType,
      item: itemName,
      amount: finalAmount,
      date: new Date().toLocaleDateString('en-GB')
    };

    records.push(newRecord);
    localStorage.setItem('accounting_records', JSON.stringify(records));
    renderRecords();

    // 6. UI Feedback
    const typeTag = recordType === 'income' ? '💰 Income' : '💸 Expense';
    document.getElementById('status-text').innerText = `Heard: "${cleanText}"\n✅ Added to [${currentAccount}] ${typeTag}: ${itemName} $${finalAmount}`;
  }

  function deleteRecord(id) {
    records = records.filter(r => r.id !== id);
    localStorage.setItem('accounting_records', JSON.stringify(records));
    renderRecords();
  }

  function renderRecords() {
    const listEl = document.getElementById('record-list');
    listEl.innerHTML = '';
    
    let totalIncome = 0;
    let totalExpense = 0;

    records.filter(r => r.account === currentAccount).forEach(r => {
      const type = r.type || 'expense';
      if (type === 'income') {
        totalIncome += r.amount;
      } else {
        totalExpense += r.amount;
      }
    });

    document.getElementById('total-income').innerText = totalIncome;
    document.getElementById('total-expense').innerText = totalExpense;

    const filtered = records.filter(r => r.account === currentAccount && (r.type || 'expense') === currentType);

    if (filtered.length === 0) {
      listEl.innerHTML = '<li style="text-align:center; color:#999; padding:20px 0;">No records yet</li>';
      return;
    }

    filtered.forEach(r => {
      const li = document.createElement('li');
      li.className = 'list-item';
      
      const isInc = r.type === 'income';
      const amtClass = isInc ? 'amount-income' : 'amount-expense';
      const sign = isInc ? '+$' : '-$';

      li.innerHTML = `
        <div>
          <strong style="color: var(--jewel-teal);">${r.item}</strong> 
          <span style="font-size: 12px; color: #888;">(${r.date})</span>
        </div>
        <div>
          <span class="${amtClass}">${sign}${r.amount}</span>
          <span class="delete-btn" onclick="deleteRecord(${r.id})">✕</span>
        </div>
      `;
      listEl.appendChild(li);
    });
  }

  renderRecords();
</script>

</body>
</html>
