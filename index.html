<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奢華風語音記帳</title>
  <style>
    :root {
      --jewel-teal: #0D5C63;
      --rich-gold: #C5A059;
      --amethyst-purple: #4A2040;
      --bg-color: #F8F6F0;
      --text-color: #2C2C2C;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); margin: 0; padding: 20px; color: var(--text-color); }
    .container { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 24px; border-radius: 20px; box-shadow: 0 10px 25px rgba(13, 92, 99, 0.08); border: 1px solid rgba(197, 160, 89, 0.2); }
    
    h2 { text-align: center; margin-top: 0; color: var(--jewel-teal); font-weight: 700; letter-spacing: 1px; }
    
    .tab-group { display: flex; gap: 10px; margin-bottom: 20px; background: #EFECE6; padding: 5px; border-radius: 12px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #666; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { background: var(--jewel-teal); color: #ffffff; box-shadow: 0 4px 10px rgba(13, 92, 99, 0.2); }
    
    .card { background: linear-gradient(135deg, var(--amethyst-purple), #31132A); color: #ffffff; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 6px 15px rgba(74, 32, 64, 0.2); border-left: 5px solid var(--rich-gold); }
    .card-account { font-size: 14px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-total { margin-top: 8px; font-size: 28px; font-weight: bold; color: #FFF; }
    .card-total span { color: var(--rich-gold); }

    .mic-btn { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; color: #ffffff; background: linear-gradient(135deg, var(--rich-gold), #A8833E); border: none; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; box-shadow: 0 4px 12px rgba(197, 160, 89, 0.3); transition: 0.3s; }
    .mic-btn.recording { background: #D9534F; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    
    .status { text-align: center; font-size: 13px; color: #777; min-height: 20px; margin-bottom: 15px; }
    
    .list { list-style: none; padding: 0; margin: 0; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #EFECE6; }
    .amount { font-weight: bold; color: var(--amethyst-purple); font-size: 17px; }
    .delete-btn { color: #BBB; font-size: 14px; cursor: pointer; margin-left: 12px; transition: 0.2s; }
    .delete-btn:hover { color: #D9534F; }
  </style>
</head>
<body>

<div class="container">
  <h2>語音記帳 App</h2>
  
  <div class="tab-group">
    <button class="tab-btn active" id="tab-studio" onclick="switchAccount('Studio')">🏢 Studio</button>
    <button class="tab-btn" id="tab-personal" onclick="switchAccount('Personal')">🏠 Personal (私人)</button>
  </div>

  <div class="card">
    <div class="card-account">目前帳戶：<strong id="current-account-display">Studio</strong></div>
    <div class="card-total">總支出：$ <span id="total-amount">0</span></div>
  </div>

  <button class="mic-btn" id="mic-btn" onclick="toggleListening()">
    <span id="mic-icon">🎙️</span> <span id="mic-text">點擊開始語音輸入</span>
  </button>

  <div class="status" id="status-text">直接講：「私人 dinner 150」或「Studio 租金 10000」</div>

  <h3 style="color: var(--jewel-teal); font-size: 16px; margin-top: 25px;">近期紀錄</h3>
  <ul class="list" id="record-list"></ul>
</div>

<script>
  let currentAccount = 'Studio';
  let records = JSON.parse(localStorage.getItem('accounting_records') || '[]');
  let recognition = null;
  let isListening = false;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'zh-HK';

    recognition.onstart = () => {
      isListening = true;
      document.getElementById('mic-btn').classList.add('recording');
      document.getElementById('mic-text').innerText = '聆聽中...請說話';
      document.getElementById('status-text').innerText = '正在聆聽...';
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      document.getElementById('status-text').innerText = `收到：「${transcript}」`;
      parseSpeechSmart(transcript);
    };

    recognition.onerror = () => {
      document.getElementById('status-text').innerText = '聽不清楚，請再試一次';
      stopListening();
    };

    recognition.onend = () => stopListening();
  } else {
    document.getElementById('status-text').innerText = '你的瀏覽器不支援語音辨識';
  }

  function toggleListening() {
    if (!recognition) return;
    isListening ? recognition.stop() : recognition.start();
  }

  function stopListening() {
    isListening = false;
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('mic-text').innerText = '點擊開始語音輸入';
  }

  function switchAccount(account) {
    currentAccount = account;
    document.getElementById('tab-studio').classList.toggle('active', account === 'Studio');
    document.getElementById('tab-personal').classList.toggle('active', account === 'Personal');
    document.getElementById('current-account-display').innerText = account === 'Personal' ? 'Personal (私人)' : 'Studio';
    renderRecords();
  }

  function parseSpeechSmart(text) {
    let raw = text.trim();
    let lower = raw.toLowerCase();

    if (/私人|個人|personal|自己|私事/.test(lower)) {
      switchAccount('Personal');
    } else if (/studio|工作室|公事|公司|工作坊/.test(lower)) {
      switchAccount('Studio');
    }

    const numbers = raw.match(/\d+/g);
    if (!numbers) {
      document.getElementById('status-text').innerText = `已切換至【${currentAccount}】，但未聽見金額數字`;
      return;
    }
    const amount = parseInt(numbers[numbers.length - 1], 10);

    let itemName = raw
      .replace(/私人|個人|personal|自己|私事|studio|工作室|公事|公司|新增|支出|記錄|記帳/gi, '')
      .replace(/\d+/g, '')
      .replace(/[，,。.！!]/g, '')
      .trim();

    if (!itemName) itemName = '雜項開支';

    const record = {
      id: Date.now(),
      account: currentAccount,
      item: itemName,
      amount: amount,
      date: new Date().toLocaleDateString('zh-HK')
    };

    records.push(record);
    localStorage.setItem('accounting_records', JSON.stringify(records));
    renderRecords();
    document.getElementById('status-text').innerText = `成功新增至【${currentAccount}】：${itemName} $${amount}`;
  }

  function deleteRecord(id) {
    records = records.filter(r => r.id !== id);
    localStorage.setItem('accounting_records', JSON.stringify(records));
    renderRecords();
  }

  function renderRecords() {
    const listEl = document.getElementById('record-list');
    listEl.innerHTML = '';
    
    const filtered = records.filter(r => r.account === currentAccount);
    let total = 0;

    filtered.forEach(r => {
      total += r.amount;
      const li = document.createElement('li');
      li.className = 'list-item';
      li.innerHTML = `
        <div>
          <strong style="color: var(--jewel-teal);">${r.item}</strong> 
          <span style="font-size: 12px; color: #888;">(${r.date})</span>
        </div>
        <div>
          <span class="amount">-$${r.amount}</span>
          <span class="delete-btn" onclick="deleteRecord(${r.id})">✕</span>
        </div>
      `;
      listEl.appendChild(li);
    });

    document.getElementById('total-amount').innerText = total;
  }

  renderRecords();
</script>

</body>
</html>
