<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voice Expense Tracker</title>
  <style>
    :root {
      --sage-green: #8A9A86;
      --deep-sage: #3B4A39;
      --matte-gold: #C5A059;
      --soft-bg: #F4F6F3;
      --card-bg: #FFFFFF;
      --text-dark: #2A3229;
      --income-green: #2E7D32;
      --expense-red: #C62828;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--soft-bg); margin: 0; padding: 16px; color: var(--text-dark); }
    .container { max-width: 480px; margin: 0 auto; background: var(--card-bg); padding: 24px; border-radius: 24px; box-shadow: 0 12px 30px rgba(59, 74, 57, 0.08); border: 1px solid rgba(197, 160, 89, 0.25); }
    
    h2 { text-align: center; margin: 0 0 18px 0; color: var(--deep-sage); font-weight: 700; font-size: 22px; }
    
    /* Account Tabs */
    .account-tab-group { display: flex; gap: 8px; margin-bottom: 12px; background: #EAECE8; padding: 4px; border-radius: 16px; }
    .account-tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #666; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s; }
    .account-tab-btn.active { background: var(--deep-sage); color: #ffffff; box-shadow: 0 4px 10px rgba(59, 74, 57, 0.2); }

    /* Type Tabs */
    .type-tab-group { display: flex; gap: 8px; margin-bottom: 16px; }
    .type-tab-btn { flex: 1; padding: 10px; border: 1px solid var(--sage-green); background: transparent; color: var(--deep-sage); border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.3s; }
    .type-tab-btn.active-expense { background: var(--expense-red); color: #FFF; border-color: var(--expense-red); }
    .type-tab-btn.active-income { background: var(--income-green); color: #FFF; border-color: var(--income-green); }
    
    /* Summary Card */
    .card { background: linear-gradient(135deg, var(--deep-sage), #253124); color: #ffffff; padding: 20px; border-radius: 20px; margin-bottom: 18px; box-shadow: 0 8px 20px rgba(59, 74, 57, 0.18); border-left: 6px solid var(--matte-gold); }
    .card-account { font-size: 13px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; text-align: center; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .summary-item { text-align: center; background: rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 12px; }
    .summary-label { font-size: 12px; opacity: 0.85; margin-bottom: 4px; }
    .summary-val { font-size: 18px; font-weight: bold; }
    .summary-val.income { color: #81C784; }
    .summary-val.expense { color: #FF8A80; }

    /* Mic Button */
    .mic-btn { width: 100%; padding: 16px; font-size: 16px; font-weight: bold; color: #ffffff; background: linear-gradient(135deg, var(--matte-gold), #A8833E); border: none; border-radius: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(197, 160, 89, 0.35); transition: 0.3s; }
    .mic-btn.recording { background: var(--expense-red); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    
    .status { text-align: center; font-size: 13px; color: #555; min-height: 24px; margin-bottom: 16px; word-break: break-all; padding: 10px; background: #EFEFEF; border-radius: 12px; border: 1px solid #E0E0E0; white-space: pre-line; }
    
    /* Manual Input Section */
    .manual-box { background: #F8F9F8; padding: 12px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #E0E4DF; display: flex; gap: 8px; }
    .manual-input { flex: 2; padding: 10px; border: 1px solid #CCC; border-radius: 10px; font-size: 14px; }
    .manual-amount { flex: 1; padding: 10px; border: 1px solid #CCC; border-radius: 10px; font-size: 14px; }
    .manual-btn { padding: 10px 16px; background: var(--deep-sage); color: #FFF; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

    /* Record List */
    .list { list-style: none; padding: 0; margin: 0; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #EAECE8; }
    .amount-expense { font-weight: bold; color: var(--expense-red); font-size: 16px; }
    .amount-income { font-weight: bold; color: var(--income-green); font-size: 16px; }
    .delete-btn { color: #BBB; font-size: 16px; cursor: pointer; margin-left: 12px; padding: 4px 8px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Voice Expense Tracker</h2>
  
  <!-- Account Switcher -->
  <div class="account-tab-group">
    <button class="account-tab-btn active" id="tab-studio" onclick="switchAccount('Studio')">🏢 Studio</button>
    <button class="account-tab-btn" id="tab-personal" onclick="switchAccount('Personal')">🏠 Personal</button>
  </div>

  <!-- Type Switcher -->
  <div class="type-tab-group">
    <button class="type-tab-btn active-expense" id="tab-expense" onclick="switchType('expense')">💸 Expense</button>
    <button class="type-tab-btn" id="tab-income" onclick="switchType('income')">💰 Income</button>
  </div>

  <!-- Summary Card -->
  <div class="card">
    <div class="card-account">Current Account: <strong id="current-account-display">Studio</strong></div>
    <div class="summary-grid">
      <div class="summary-item">
        <div class="summary-label">Total Income</div>
        <div class="summary-val income">$ <span id="total-income">0</span></div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Total Expense</div>
        <div class="summary-val expense">$ <span id="total-expense">0</span></div>
      </div>
    </div>
  </div>

  <!-- Mic Button -->
  <button class="mic-btn" id="mic-btn" onclick="toggleListening()">
    <span id="mic-icon">🎙️</span> <span id="mic-text">Tap to Speak</span>
  </button>

  <div class="status" id="status-text">Try saying: "Dinner 20" or "Coffee 5"</div>

  <!-- Quick Manual Add Fallback -->
  <div class="manual-box">
    <input type="text" id="manual-name" class="manual-input" placeholder="Item name">
    <input type="number" id="manual-amt" class="manual-amount" placeholder="$">
    <button class="manual-btn" onclick="addManualRecord()">Add</button>
  </div>

  <h3 style="color: var(--deep-sage); font-size: 15px; margin: 10px 0;" id="list-title">Recent Expenses</h3>
  <ul class="list" id="record-list"></ul>
</div>

<script>
  let currentAccount = 'Studio';
  let currentType = 'expense';
  let records = JSON.parse(localStorage.getItem('accounting_records') || '[]');
  let recognition = null;
  let isListening = false;

  // 初始化語音辨識
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
      isListening = true;
      document.getElementById('mic-btn').classList.add('recording');
      document.getElementById('mic-text').innerText = 'Listening... Speak now';
      document.getElementById('status-text').innerText = '🎙️ Listening...';
    };

    // 手機重要修正：收到結果時立刻進行同步處理，不等待 onend
    recognition.onresult = (event) => {
      if (event.results && event.results.length > 0) {
        const transcript = event.results[0][0].transcript;
        // 立即處理
        executeAddFromVoice(transcript);
      }
    };

    recognition.onerror = (e) => {
      document.getElementById('status-text').innerText = '⚠️ Could not understand. Try again or use manual input below.';
      stopListening();
    };

    recognition.onend = () => stopListening();
  } else {
    document.getElementById('status-text').innerText = 'Speech recognition not supported on this device.';
  }

  function toggleListening() {
    if (!recognition) return;
    if (isListening) {
      recognition.stop();
    } else {
      try {
        recognition.start();
      } catch(e) {
        recognition.stop();
        setTimeout(() => recognition.start(), 200);
      }
    }
  }

  function stopListening() {
    isListening = false;
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('mic-text').innerText = 'Tap to Speak';
  }

  function switchAccount(account) {
    currentAccount = account;
    document.getElementById('tab-studio').classList.toggle('active', account === 'Studio');
    document.getElementById('tab-personal').classList.toggle('active', account === 'Personal');
    document.getElementById('current-account-display').innerText = account;
    renderRecords();
  }

  function switchType(type) {
    currentType = type;
    const expBtn = document.getElementById('tab-expense');
    const incBtn = document.getElementById('tab-income');

    if (type === 'expense') {
      expBtn.className = 'type-tab-btn active-expense';
      incBtn.className = 'type-tab-btn';
      document.getElementById('list-title').innerText = 'Recent Expenses';
    } else {
      expBtn.className = 'type-tab-btn';
      incBtn.className = 'type-tab-btn active-income';
      document.getElementById('list-title').innerText = 'Recent Income';
    }
    renderRecords();
  }

  // 數字解析 (含英文文字數字)
  function parseNumber(str) {
    const wordMap = {
      'one':1, 'two':2, 'three':3, 'four':4, 'five':5, 'six':6, 'seven':7, 'eight':8, 'nine':9, 'ten':10,
      'eleven':11, 'twelve':12, 'thirteen':13, 'fourteen':14, 'fifteen':15, 'sixteen':16, 'seventeen':17, 'eighteen':18, 'nineteen':19,
      'twenty':20, 'thirty':30, 'forty':40, 'fifty':50, 'sixty':60, 'seventy':70, 'eighty':80, 'ninety':90,
      'hundred':100, 'thousand':1000
    };

    // 優先抓取阿拉伯數字
    const numMatches = str.match(/\d+/g);
    if (numMatches && numMatches.length > 0) {
      return parseInt(numMatches[numMatches.length - 1], 10);
    }

    // 備用抓取文字數字
    const words = str.toLowerCase().split(/\s+/);
    for (let w of words) {
      if (wordMap[w]) return wordMap[w];
    }

    return null;
  }

  // 核心同步語音新增邏輯 (手機專用優化)
  function executeAddFromVoice(rawText) {
    if (!rawText) return;

    stopListening();

    let text = rawText.trim();
    let lower = text.toLowerCase();

    // 1. 自動辨識 Account
    if (/\b(personal|private|self|me)\b/.test(lower)) {
      switchAccount('Personal');
    } else if (/\b(studio|office|company|work)\b/.test(lower)) {
      switchAccount('Studio');
    }

    // 2. 自動辨識 Type
    let recordType = currentType;
    if (/\b(income|earned|gain|receive|salary|fee|tuition)\b/.test(lower)) {
      recordType = 'income';
    } else if (/\b(expense|spent|bought|pay|paid|cost|dinner|lunch|breakfast|coffee|rent)\b/.test(lower)) {
      recordType = 'expense';
    }
    switchType(recordType);

    // 3. 解析金額 (如果沒解析到預設為 0，避免無法新增)
    let amount = parseNumber(text);
    if (amount === null) amount = 0;

    // 4. 清理項目名稱
    let item = text
      .replace(/\b(personal|studio|add|record|save|expense|income|dollars?|bucks?)\b/gi, '')
      .replace(/\d+/g, '')
      .replace(/[.,!]/g, '')
      .trim();

    // 保底名稱
    if (!item) {
      if (/dinner|lunch|breakfast|coffee|food|meal/.test(lower)) item = 'Meal';
      else item = recordType === 'income' ? 'Income' : 'Expense';
    }

    item = item.charAt(0).toUpperCase() + item.slice(1);

    // 5. 立即寫入數據
    const newRecord = {
      id: Date.now(),
      account: currentAccount,
      type: recordType,
      item: item,
      amount: amount,
      date: new Date().toLocaleDateString('en-GB')
    };

    records.push(newRecord);
    localStorage.setItem('accounting_records', JSON.stringify(records));
    
    // 6. 觸發手機震動反饋 (若手機支援)
    if (navigator.vibrate) navigator.vibrate(50);

    // 7. 更新畫面與狀態
    renderRecords();
    document.getElementById('status-text').innerText = `Heard: "${text}"\n✅ Success: ${item} $${amount}`;
  }

  // 手動新增備用
  function addManualRecord() {
    const nameEl = document.getElementById('manual-name');
    const amtEl = document.getElementById('manual-amt');
    
    const name = nameEl.value.trim() || 'Expense';
    const amt = parseInt(amtEl.value, 10) || 0;

    const newRecord = {
      id: Date.now(),
      account: currentAccount,
      type: currentType,
      item: name,
      amount: amt,
      date: new Date().toLocaleDateString('en-GB')
    };

    records.push(newRecord);
    localStorage.setItem('accounting_records', JSON.stringify(records));
    
    nameEl.value = '';
    amtEl.value = '';
    
    renderRecords();
    document.getElementById('status-text').innerText = `✅ Manually Added: ${name} $${amt}`;
  }

  function deleteRecord(id) {
    records = records.filter(r => r.id !== id);
    localStorage.setItem('accounting_records', JSON.stringify(records));
    renderRecords();
  }

  function renderRecords() {
    const listEl = document.getElementById('record-list');
    listEl.innerHTML = '';
    
    let totalIncome = 0;
    let totalExpense = 0;

    records.filter(r => r.account === currentAccount).forEach(r => {
      const type = r.type || 'expense';
      if (type === 'income') {
        totalIncome += r.amount;
      } else {
        totalExpense += r.amount;
      }
    });

    document.getElementById('total-income').innerText = totalIncome;
    document.getElementById('total-expense').innerText = totalExpense;

    const filtered = records.filter(r => r.account === currentAccount && (r.type || 'expense') === currentType);

    if (filtered.length === 0) {
      listEl.innerHTML = '<li style="text-align:center; color:#999; padding:20px 0;">No records in this section</li>';
      return;
    }

    filtered.forEach(r => {
      const li = document.createElement('li');
      li.className = 'list-item';
      
      const isInc = r.type === 'income';
      const amtClass = isInc ? 'amount-income' : 'amount-expense';
      const sign = isInc ? '+$' : '-$';

      li.innerHTML = `
        <div>
          <strong style="color: var(--deep-sage);">${r.item}</strong> 
          <span style="font-size: 12px; color: #888;">(${r.date})</span>
        </div>
        <div>
          <span class="${amtClass}">${sign}${r.amount}</span>
          <span class="delete-btn" onclick="deleteRecord(${r.id})">✕</span>
        </div>
      `;
      listEl.appendChild(li);
    });
  }

  renderRecords();
</script>

</body>
</html>
